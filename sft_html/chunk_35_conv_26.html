<!DOCTYPE html>
<html lang="en" data-bbox="0,0,1280,720">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postmill - A Modern Forum Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #f8f9fa;
            --surface-color: #ffffff;
            --border-color: #e9ecef;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --primary-light: #e7f1ff;
            --font-family: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 16px;
        }

        a {
            text-decoration: none;
            color: var(--text-primary);
            transition: color 0.2s ease-in-out;
        }

        a:hover {
            color: var(--primary-color);
        }

        ul {
            list-style: none;
        }
        
        button {
            font-family: inherit;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* Header Navigation */
        .main-header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .main-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }

        .nav-left, .nav-center, .nav-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        
        .nav-center {
            flex-grow: 1;
            justify-content: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .nav-links ul, .user-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-links a {
            font-weight: 500;
            color: var(--text-secondary);
            position: relative;
            padding: 0.5rem 0;
            font-size: 0.95rem;
        }
        
        .nav-links a.active {
            color: var(--text-primary);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -22px; /* Align with header bottom border */
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after, .nav-links a.active::after {
            width: 100%;
        }

        .search-form {
            position: relative;
            max-width: 300px;
            width: 100%;
        }

        .search-form .fa-search {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 15px 8px 40px;
            width: 100%;
            transition: all 0.2s ease-in-out;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
        }
        
        .icon-button {
            color: var(--text-secondary);
            font-size: 1.25rem;
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: background-color 0.2s, color 0.2s;
        }

        .icon-button:hover {
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .btn-submit {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--primary-color);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
            font-size: 0.9rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            color: white;
        }
        
        .user-profile button {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: none;
            border: 1px solid transparent;
            padding: 6px 12px 6px 6px;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .user-profile button:hover {
            background-color: var(--bg-color);
            border-color: var(--border-color);
        }

        .user-profile strong {
            font-weight: 600;
        }
        
        .user-profile i {
            font-size: 1.75rem;
            color: #adb5bd;
        }
        
        /* Main Content Area */
        .content-wrapper {
            padding: 2.5rem 0;
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        main {
            flex: 1;
            min-width: 0;
        }

        aside.sidebar {
            flex-basis: 300px;
            flex-shrink: 0;
            position: sticky;
            top: 88px; /* header height + padding */
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        /* Content Navigation */
        .content-nav {
            border-bottom: 1px solid var(--border-color);
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-nav-tabs, .content-nav-filters {
            display: flex;
        }

        .content-nav-tabs a, .content-nav-filters button {
            padding: 0.75rem 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.95rem;
            border-bottom: 3px solid transparent;
            margin-bottom: -1px; /* To align with the parent border */
            transition: color 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .content-nav-tabs a:hover, .content-nav-filters button:hover {
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .content-nav-tabs a.active, .content-nav-filters button.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        /* Empty State Message */
        .empty-state {
            text-align: center;
            padding: 4rem 1.5rem;
            color: var(--text-secondary);
        }

        .sidebar {
            padding: 1.5rem;
        }
        
        .sidebar h1 {
            font-size: 1rem;
            margin-bottom: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .sidebar small {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--primary-color);
            font-weight: 500;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const setupNavGroup = (selector) => {
                const group = document.querySelector(selector);
                if (!group) return;

                const links = group.querySelectorAll('a, button');
                links.forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        // Remove 'active' from all siblings in the same group
                        links.forEach(l => l.classList.remove('active'));
                        // Add 'active' to the clicked item
                        e.currentTarget.classList.add('active');
                    });
                });
            };

            setupNavGroup('.content-nav-tabs');
            setupNavGroup('.content-nav-filters');
        });
    </script>
