<head>
    <meta charset="UTF-8">

    <title>User Profile Settings - GitLab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --font-family: 'Inter', sans-serif;
            --header-bg: #ffffff;
            --sidebar-bg: #2c3e50;
            --main-bg: #f8f9fa;
            --content-bg: #ffffff;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --text-light: #f8f9fa;
            --border-color: #e9ecef;
            --accent-color: #4a90e2;
            --button-primary-bg: #2e86de;
            --button-primary-hover-bg: #1e6ab3;
            --button-secondary-bg: #f1f3f5;
            --button-secondary-hover-bg: #e9ecef;
            --input-border: #ced4da;
            --input-focus-border: #80bdff;
            --sidebar-width: 250px;
            --header-height: 48px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: var(--font-family);
            font-size: 14px;
            color: var(--text-primary);
            background-color: var(--main-bg);
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main";
            grid-template-rows: var(--header-height) 1fr;
            grid-template-columns: var(--sidebar-width) 1fr;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .app-header {
            grid-area: header;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        
        .logo-container { display: flex; align-items: center; font-size: 24px; color: #e24329; }
        .gitlab-logo { font-size: 24px; color: #fc6d26; }
        .search-container { position: relative; flex-grow: 1; max-width: 320px; }
        .search-container i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
        #5 {
            width: 100%;
            height: 32px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            padding: 0 12px 0 34px;
            font-size: 14px;
            background-color: #f8f9fa;
        }
        #5::placeholder { color: var(--text-secondary); }
        #5:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2); }

        .header-actions { display: flex; align-items: center; gap: 16px; margin-left: auto; }
        .action-group { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); cursor: pointer; }
        .action-group i { font-size: 16px; }
        .action-group span { font-weight: 500; font-size: 13px; }
        .action-group:hover { color: var(--text-primary); }
        .user-menu { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        #17 { border-radius: 50%; width: 24px; height: 24px; object-fit: cover; }

        .app-sidebar {
            grid-area: sidebar;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: fixed;
            top: var(--header-height);
            left: 0;
            height: calc(100vh - var(--header-height));
            width: var(--sidebar-width);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        #19 { border-radius: 50%; width: 32px; height: 32px; object-fit: cover; }
        #20 { font-weight: 600; font-size: 16px; }

        .sidebar-nav {
            list-style: none;
            padding: 16px 0;
            flex-grow: 1;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }
        .sidebar-nav a.active {
            background-color: rgba(0, 0, 0, 0.2);
            border-left: 3px solid var(--accent-color);
            padding-left: 17px;
        }
        .sidebar-nav a:hover:not(.active) { background-color: var(--sidebar-hover-bg, #34495e); }
        .sidebar-nav i { width: 16px; text-align: center; }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .collapse-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-light);
            opacity: 0.8;
            font-size: 13px;
        }
        .collapse-link:hover { opacity: 1; }
        
        .app-content {
            grid-area: main;
            padding: 24px;
            background-color: var(--main-bg);
            margin-top: var(--header-height);
        }
        
        .profile-form-container {
            max-width: 958px;
            margin: 0 auto;
            background: var(--content-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .form-content {
            padding: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }
        
        @media (min-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group label {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            max-width: 320px;
            height: 34px;
            padding: 0 12px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background-color: var(--input-bg);
            font-size: 14px;
            font-family: var(--font-family);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group select { height: 32px; }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.25);
        }

        .form-group .help-link {
            font-size: 12px;
            margin-top: 4px;
        }

        .form-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button, .btn-link {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
        }
        
        .btn-primary {
            background-color: var(--button-primary-bg);
            color: var(--button-primary-text);
        }
        .btn-primary:hover { background-color: var(--button-primary-hover-bg); }

        .btn-secondary {
            background-color: var(--button-secondary-bg);
            color: var(--text-primary);
            border: 1px solid var(--input-border);
        }
        .btn-secondary:hover { background-color: var(--button-secondary-hover-bg); }

    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form[data-bbox="281,-920,958,2084"]');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const submitButton = form.querySelector('button[type="submit"]');
                    const buttonSpan = submitButton.querySelector('span');
                    
                    if (submitButton && buttonSpan) {
                        const originalText = buttonSpan.textContent;
                        buttonSpan.textContent = 'Saving...';
                        submitButton.disabled = true;

                        setTimeout(() => {
                            buttonSpan.textContent = 'Settings Saved!';
                            submitButton.style.backgroundColor = '#28a745'; // Success color
                        }, 1500);

                        setTimeout(() => {
                            buttonSpan.textContent = originalText;
                            submitButton.disabled = false;
                            submitButton.style.backgroundColor = ''; // Revert to original color
                        }, 3500);
                    }
                });
            }
        });
    </script>
