        :root {

        body {

            background-color: var(--background);
            color: var(--primary-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        div[data-bbox="160,48,960,551"] {
            background-color: var(--white);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            padding: 48px;
            max-width: 480px;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        div[data-bbox="175,129,930,97"] {

            flex-direction: column;
            width: 100%;
        }
        
        form > div {
            margin-bottom: 20px;
        }
        form > div:last-of-type {
            margin-bottom: 0;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: var(--secondary-text);
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }

        input[data-testid="username-field"],
        input[data-testid="password-field"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--input-bg);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[data-testid="username-field"]:focus,
        input[data-testid="password-field"]:focus {
            outline: none;
            border-color: var(--brand-color);
            background-color: var(--white);
            box-shadow: 0 0 0 3px rgba(252, 109, 38, 0.2);
        }

        div[data-bbox="408,401,465,26"] {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        div[data-bbox="424,403,114,24"] > div {

             align-items: center;
             gap: 8px;
        }

        input[value="1"] {
            width: 18px;
            height: 18px;
            accent-color: var(--brand-color);
            cursor: pointer;
        }

        a {
            color: var(--brand-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--brand-color-hover);
            text-decoration: underline;
        }

        button[data-testid="sign-in-button"] {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: var(--white);
            background-color: var(--brand-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button[data-testid="sign-in-button"]:hover {
            background-color: var(--brand-color-hover);
        }
        
        button[data-testid="sign-in-button"]:active {
            transform: scale(0.98);
        }

        p[data-bbox="408,499,465,19"] {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--secondary-text);
        }

        hr {
            display: none; /* Hide the original hr to create a cleaner layout */
        }

        div[data-bbox="160,680,960,40"] {
            margin-top: 40px;
            text-align: center;
        }

        div[data-bbox="175,680,341,20"] a {
            font-size: 13px;
            color: var(--secondary-text);
            margin: 0 12px;
        }
    </style>
</head>
