<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postmill - Modern Forum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --secondary-color: #6c757d;
            --background-color: #f8f9fa;
            --surface-color: #ffffff;
            --text-color: #212529;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
            --border-radius: 0.5rem;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            font-size: 16px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.2s ease-in-out;
        }

        a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Header Navigation */
        .main-nav-wrapper {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .main-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }

        .nav-left, .nav-center, .nav-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-logo b {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .nav-links ul, .nav-auth ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a, .nav-auth a {
            font-weight: 500;
            color: var(--text-muted);
            padding: 0.5rem 0;
            position: relative;
            text-decoration: none;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary-color);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .nav-links a:hover::after, .nav-links a.active::after {
            transform: scaleX(1);
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-color);
        }
        
        .search-form {
            position: relative;
            width: 250px;
        }
        
        .search-form .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-form input[type="search"] {
            width: 100%;
            padding: 0.6rem 0.75rem 0.6rem 2.5rem;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            background-color: #f1f3f5;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }
        
        .search-form input[type="search"]:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }

        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            border-radius: var(--border-radius);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            color: white;
            text-decoration: none;
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background-color: #e9ecef;
            color: var(--text-color);
            text-decoration: none;
        }

        /* Main Content Area */
        .content-wrapper {
            padding: 2rem 0;
            flex-grow: 1;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .filter-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-color);
            padding: 0.5rem;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }

        .filter-tabs ul, .filter-dropdowns ul {
            list-style: none;
            display: flex;
            gap: 0.5rem;
        }

        .filter-tabs a {
            padding: 0.75rem 1.25rem;
            border-radius: var(--border-radius);
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .filter-tabs a.active, .filter-tabs a:hover {
            background-color: #e9ecef;
            color: var(--text-color);
        }

        .filter-dropdowns button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .filter-dropdowns button:hover {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }
        
        .filter-dropdowns button i {
            color: var(--text-muted);
        }

        /* Sidebar */
        .sidebar-section {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
        }

        .sidebar-section h1 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }
        
        .sidebar-section small {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem 0;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        .footer a {
            font-weight: 500;
            color: var(--text-muted);
        }
        .footer a:hover {
            color: var(--text-color);
        }

    </style>
</head>
<body data-bbox="0,0,1280,720">

        <div class="container main-nav" data-bbox="90,0,1100,52">

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Interactive hover effect for filter buttons
            const filterButtons = document.querySelectorAll('.filter-dropdowns button');
            filterButtons.forEach(button => {
                button.addEventListener('mouseenter', () => {
                    button.style.transform = 'translateY(-2px)';
                    button.style.boxShadow = '0 4px 8px rgba(0,0,0,0.1)';
                });
                button.addEventListener('mouseleave', () => {
                    button.style.transform = 'translateY(0)';
                    button.style.boxShadow = 'none';
                });
            });

            // Simple alert on sign up click for demonstration
            const signUpButton = document.getElementById('6');
            if (signUpButton) {
                signUpButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('Sign up functionality coming soon!');
                });
            }

            // Tab switching logic for main nav and filter nav
            const setActiveTab = (selector) => {
                const links = document.querySelectorAll(selector);
                links.forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        links.forEach(l => l.classList.remove('active'));
                        e.currentTarget.classList.add('active');
                    });
                });
            };
            
            setActiveTab('.nav-links a');
            setActiveTab('.filter-tabs a');
        });
    </script>
</body>
</html>
