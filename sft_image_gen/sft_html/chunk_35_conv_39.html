    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary-color: #4A90E2;
            --secondary-color: #2C3E50;
            --accent-color: #34D399;
            --background-color: #F7F9FC;
            --surface-color: #FFFFFF;

            --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
            --border-radius: 8px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header & Navigation */
        .main-header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        div[data-bbox="90,0,1100,52"] {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            max-width: 1100px;
            margin: 0 auto;
        }

        #0 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        div[data-bbox="194,0,148,52"] ul,
        ul[data-bbox="1014,0,162,52"] {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        ul a {
            text-decoration: none;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 1rem;
            padding: 8px 4px;
            border-bottom: 2px solid transparent;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        ul a:hover, ul a.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        form[data-bbox="560,0,236,52"] {
            position: relative;
        }

        form[data-bbox="560,0,236,52"]::before {
            content: "\f002";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        #4 {
            width: 250px;
            height: 40px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            background-color: #f0f2f5;
            padding: 0 15px 0 40px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        #4:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        #6 {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border-radius: var(--border-radius);
            border-bottom: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        #6:hover {
            background-color: #3a7ac8;
            transform: translateY(-2px);
            color: white;
            border-bottom: none;
        }
        #5 {
            padding: 10px 12px;
        }
        #5:hover {
            background-color: #f0f2f5;
            border-radius: var(--border-radius);
            border-bottom: none;
        }
        
        /* Main Content Area */
        main {
            padding: 2.5rem 0;
        }

        div[data-bbox="90,52,1100,103"] {

            gap: 2rem;
            max-width: 1100px;
            margin: 0 auto;

        }
        
        /* Sub-navigation Tabs and Filters */
        ul[data-bbox="104,80,189,35"] {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem 0;
            display: flex;
            gap: 1.5rem;
            border-bottom: 1px solid var(--border-color);

        ul[data-bbox="104,80,189,35"] a {
            padding: 0.75rem 0;
            font-weight: 600;
            margin-bottom: -1px;
            border-bottom: 3px solid transparent;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        #7 {
            border-bottom-color: var(--primary-color);
            color: var(--primary-color);
        }

        #8:hover {
            color: var(--primary-color);
        }
        
        ul[data-bbox="307,80,177,35"] {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 0.75rem;
        }
        
        ul[data-bbox="307,80,177,35"] li button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--surface-color);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        ul[data-bbox="307,80,177,35"] li button:hover {
            background-color: #f0f2f5;
            border-color: #c8d1db;
            transform: translateY(-1px);
        }

        ul[data-bbox="307,80,177,35"] li button .fa-star { color: #F5A623; }
        ul[data-bbox="307,80,177,35"] li button .fa-fire { color: #D0021B; }
        ul[data-bbox="307,80,177,35"] li button .fa-chevron-down { font-size: 0.7em; color: var(--text-secondary); }

        /* Sidebar Section */
        section[data-bbox="910,66,280,89"] {
            width: 280px;
            flex-shrink: 0;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            height: fit-content;
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        section[data-bbox="910,66,280,89"].card-hover {
            transform: translateY(-5px);

        }

        h1[data-text="Featured forums"] {

            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        small[data-text="There are no featured forums to display."] {

            color: var(--text-secondary);
        }
        
        /* Footer */
        footer {
            text-align: center;

            margin-top: 4rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        footer a:hover {
            text-decoration: underline;
        }

    </style>
</head>
